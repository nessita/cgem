<a id="{{ id }}" href="{{ href }}" aria-label="{{ label }}" title="{{ label }}"
   hx-boost="true" hx-target="#content" hx-select="#content"
   hx-swap="outerHTML show:none focus-scroll:false" hx-sync="#content:replace"
   class="flex h-8 w-8 items-center justify-center rounded-md shrink-0 text-lg text-stone-500 hover:bg-stone-100 hover:text-stone-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-stone-400">
    <span aria-hidden="true">&times;</span>
</a>
