<a href="{{ href }}"
   class="border gap-2 inline-flex items-center max-w-full min-w-0 px-3 py-1 rounded-md text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-stone-400
          {% if selected %}font-semibold{% endif %}
          {% if group == 'month' or group == 'when' or group == 'start' or group == 'end' %}
              text-cyan-900 hover:bg-cyan-100
              {% if selected %}bg-cyan-100 border-cyan-400{% else %}bg-cyan-50 border-cyan-200{% endif %}
          {% elif group == 'year' %}
              text-sky-900 hover:bg-sky-100
              {% if selected %}bg-sky-100 border-sky-400{% else %}bg-sky-50 border-sky-200{% endif %}
          {% elif group == 'country' %}
              text-blue-900 hover:bg-blue-100
              {% if selected %}bg-blue-100 border-blue-400{% else %}bg-blue-50 border-blue-200{% endif %}
          {% elif group == 'who' %}
              text-indigo-900 hover:bg-indigo-100
              {% if selected %}bg-indigo-100 border-indigo-400{% else %}bg-indigo-50 border-indigo-200{% endif %}
          {% elif group == 'currency' %}
              text-violet-900 hover:bg-violet-100
              {% if selected %}bg-violet-100 border-violet-400{% else %}bg-violet-50 border-violet-200{% endif %}
          {% elif group == 'asset' %}
              text-purple-900 hover:bg-purple-100
              {% if selected %}bg-purple-100 border-purple-400{% else %}bg-purple-50 border-purple-200{% endif %}
          {% elif group == 'tag' or group == 'include_tag' or group == 'exclude_tag' %}
              text-teal-900 hover:bg-teal-100
              {% if selected %}bg-teal-100 border-teal-400{% else %}bg-teal-50 border-teal-200{% endif %}
          {% else %}
              text-sky-900 hover:bg-sky-100
              {% if selected %}bg-sky-100 border-sky-400{% else %}bg-sky-50 border-sky-200{% endif %}
          {% endif %}"
   {% if selected %}aria-label="Remove filter: {{ label }}"{% endif %}>
    <span class="break-words min-w-0">{{ label }}</span>
    {% if count or count == 0 %}<span class="bg-white px-2 rounded-full shrink-0 text-xs">{{ count }}</span>{% endif %}
    {% if selected %}<span class="shrink-0" aria-hidden="true">&times;</span>{% endif %}
</a>
