{% extends 'base.html' %}

{% block content %}

<h1 class="font-bold text-2xl">Import entries</h1>
<form action="." method="POST" class="bg-stone-50 border border-stone-300 flex flex-col gap-3 p-4 rounded-lg" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form }}
    <div class="flex">
        {% include "components/button.html" with label="Load" name="load" only %}
    </div>
</form>

{% endblock content %}
