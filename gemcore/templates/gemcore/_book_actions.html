{% load gemcore_tags %}
{% book_navigation book as links %}
<div class="flex flex-col gap-2">
    <input id="book-menu-{{ book.pk }}" type="checkbox" class="peer sr-only md:hidden" aria-controls="book-navigation-{{ book.pk }}">
    <label for="book-menu-{{ book.pk }}" class="cursor-pointer flex flex-row gap-2 items-center rounded-md self-start text-stone-700 md:hidden peer-focus-visible:ring-2 peer-focus-visible:ring-stone-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        Book menu
    </label>
    <nav id="book-navigation-{{ book.pk }}" aria-label="Navigation for {{ book }}" class="hidden flex-col gap-2 peer-checked:flex md:flex md:flex-row md:flex-wrap">
        {% for link in links %}
            {% include "components/button.html" with label=link.label href=link.href current=link.current variant="secondary" only %}
        {% endfor %}
    </nav>
</div>
