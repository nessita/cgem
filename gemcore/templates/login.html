{% extends 'base.html' %}

{% block content %}

<form action="." method="POST" class="form" role="form">
    {% csrf_token %}

    {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}

    {{ form.as_div }}

    <div class="btn-group">
        <button type="submit" class="btn btn-primary" name="load">Login</button>
    </div>
</form>

{% endblock content %}
